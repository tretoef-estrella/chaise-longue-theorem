# Builds the Lean proof of «The Chaise Longue Theorem» (Main Theorem′ for every degree m ≥ 1, and Theorem O with equality)
# from source, and runs the two final checks of the Lean certificate: the restatements by hand and the printed axioms.
# Started by hand (Actions tab → «Lean build» → «Run workflow»).
name: Lean build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        shell: bash
        working-directory: lean/project
    steps:
      - uses: actions/checkout@v4

      - name: Install elan (the toolchain in lean-toolchain is installed by lake)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Mathlib's compiled files
        run: lake exe cache get

      - name: Build the 233 modules of RequestProject
        run: lake build

      - name: Final check of the even degrees and of every degree (CheckPares)
        run: lake env lean ../even-degrees/checks/CheckPares.lean 2>&1 | tee CheckPares_actions.log

      - name: Final check of the odd degrees (Check29)
        run: lake env lean ../checks/Check29.lean 2>&1 | tee Check29_actions.log

      - name: No sorry and no extra axiom in the printed axioms
        run: |
          cat CheckPares_actions.log Check29_actions.log > Checks_actions.log
          if grep -q 'sorryAx' Checks_actions.log; then exit 1; fi
          if grep -q -E '(^|: )error' Checks_actions.log; then exit 1; fi
          test "$(grep -c 'depends on axioms' CheckPares_actions.log)" -eq 11
          test "$(grep -c 'depends on axioms' Check29_actions.log)" -eq 6
          grep 'depends on axioms' Checks_actions.log | grep -v -E '\[(propext|Classical\.choice|Quot\.sound)(, (propext|Classical\.choice|Quot\.sound))*\]$' && exit 1 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Checks_actions_logs
          path: |
            lean/project/CheckPares_actions.log
            lean/project/Check29_actions.log
